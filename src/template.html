<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Planner</title>
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
{{STYLE}}
</style>
</head>
<body>
<div id="app"><div class="startup-loading" role="status">Loading Daycraft…</div></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
{{SCRIPT}}
var __daycraftStarted = false;
function __startDaycraft() {
  if (__daycraftStarted) return;
  __daycraftStarted = true;
  requestAnimationFrame(function(){ boot(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __startDaycraft, { once: true }); else __startDaycraft();
window.addEventListener('load', __startDaycraft, { once: true });
window.addEventListener('pageshow', function() {
  requestAnimationFrame(function() {
    var app = document.getElementById('app');
    if (app && !app.querySelector('.shell')) {
      try { render(); } catch (e) { console.error(e); }
    }
  });
});
})();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
