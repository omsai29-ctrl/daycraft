/* ================= goals / exams / subjects / habits ================= */
function goalStats(g) {
  const ms = g.milestones || [];
  const tasks = D.tasks.filter(t => t.goalId === g.id && !isRec(t) && t.kind !== 'event');
  const total = ms.length + tasks.length;
  const done = ms.filter(m => m.done).length + tasks.filter(t => t.done).length;
  return { ms, tasks, total, done, pct: total ? Math.round(done / total * 100) : 0 };
}
const examPct = e => e.topics.length ? Math.round(e.topics.filter(t => t.done).length / e.topics.length * 100) : 0;
function subjStats(sid) {
  const tasks = D.tasks.filter(t => t.subjectId === sid && !isRec(t) && t.kind !== 'event');
  const done = tasks.filter(t => t.done).length;
  return { tasks, total: tasks.length, done, open: tasks.length - done, pct: tasks.length ? Math.round(done / tasks.length * 100) : 0 };
}
function streak(h) {
  let d = today(), n = 0;
  if (!h.log[d]) d = addDays(d, -1);
  while (h.log[d]) { n++; d = addDays(d, -1); }
  return n;
}
function daysSinceHabit(h) {
  for (let i = 0; i < 60; i++) if (h.log[addDays(today(), -i)]) return i;
  return 60;
}

/* deadlines: future things with a due date */
function deadlines(limit) {
  const td = today(), out = [];
  D.tasks.forEach(t => {
    if (isRec(t) || t.done || t.kind === 'event' || !t.due || t.due < td) return;
    out.push({ kind: 'task', id: t.id, title: t.title, date: t.due, prio: t.priority });
  });
  D.exams.forEach(e => { if (e.date >= td && diffDays(td, e.date) <= 45) out.push({ kind: 'exam', id: e.id, title: e.title, date: e.date }); });
  D.goals.forEach(g => { if (g.deadline && g.deadline >= td && diffDays(td, g.deadline) <= 30 && goalStats(g).pct < 100) out.push({ kind: 'goal', id: g.id, title: g.title, date: g.deadline }); });
  out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (PR[a.prio || 'medium'] - PR[b.prio || 'medium']));
  return limit ? out.slice(0, limit) : out;
}

/* things that need a look */
function attention() {
  const td = today(), out = [];
  overdueList().slice(0, 4).forEach(i => out.push({
    kind: 'overdue', text: i.t.title, sub: 'Overdue · ' + relLabel(i.d), a: 'resched', id: i.id, d: i.d, label: 'Reschedule'
  }));
  D.tasks.forEach(t => {
    if (isRec(t) || t.done || t.kind === 'event') return;
    const n = (t.moves || []).filter(m => m.to === 'none' || m.to > m.from).length;
    if (n >= 2 && !(t.date && t.date < td)) out.push({ kind: 'postponed', text: t.title, sub: 'Postponed ' + n + ' times — try a smaller first step', a: 'edit', id: t.id, d: t.date || td, label: 'Open' });
  });
  D.tasks.forEach(t => {
    if (isRec(t) || t.done || t.kind === 'event' || t.priority !== 'high' || t.date) return;
    out.push({ kind: 'nodate', text: t.title, sub: 'High priority, but not scheduled', a: 'edit', id: t.id, d: td, label: 'Schedule' });
  });
  D.exams.forEach(e => {
    const n = diffDays(td, e.date);
    if (n >= 0 && n <= 14 && examPct(e) < 60) out.push({ kind: 'exam', text: e.title + ' ' + inLabel(n), sub: examPct(e) + '% prepared', a: 'nav', p: 'exams', label: 'Plan revision' });
  });
  D.goals.forEach(g => {
    if (!g.deadline) return;
    const n = diffDays(td, g.deadline), st = goalStats(g);
    if (n >= 0 && n <= 10 && st.pct < 50) out.push({ kind: 'goal', text: g.title, sub: 'Due ' + inLabel(n) + ' · ' + st.pct + '% done', a: 'nav', p: 'goals', label: 'Open goal' });
  });
  D.habits.forEach(h => {
    const n = daysSinceHabit(h);
    if (n >= 3 && n < 60) out.push({ kind: 'habit', text: h.name, sub: 'No check-in for ' + n + ' days', a: 'nav', p: 'habits', label: 'Open habits' });
  });
  return out;
}

/* ================= review ================= */
function weekStartOf(d) {
  const g = pd(d).getDay(), off = (g - D.settings.weekStart + 7) % 7;
  return addDays(d, -off);
}
function weekDays(d) { const s = weekStartOf(d); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); }

function reviewData(anchor) {
  const days = weekDays(anchor), td = today();
  const planned = [];
  days.forEach(d => dayInst(d).forEach(i => { if (i.kind !== 'event') planned.push(i); }));
  const done = planned.filter(i => i.done);
  const studyMin = done.filter(i => i.kind === 'study').reduce((a, i) => a + i.dur, 0);
  const postponed = D.tasks.filter(t => (t.moves || []).some(m => days.includes(m.on) && (m.to === 'none' || m.to > m.from)));
  const perDay = days.map(() => 0);
  D.tasks.forEach(t => {
    if (t.kind === 'event') return;
    const stamps = isRec(t) ? Object.values(t.doneDates || {}) : (t.done && t.doneAt ? [t.doneAt] : []);
    stamps.forEach(s => { const i = days.indexOf(s.slice(0, 10)); if (i >= 0) perDay[i]++; });
  });
  const goalsMoved = D.goals.map(g => {
    let n = (g.milestones || []).filter(m => m.done && m.doneOn && days.includes(m.doneOn)).length;
    D.tasks.forEach(t => { if (t.goalId === g.id && !isRec(t) && t.done && t.doneAt && days.includes(t.doneAt.slice(0, 10))) n++; });
    return { g, n, pct: goalStats(g).pct };
  }).filter(x => x.n > 0);
  const upto = days.filter(d => d <= td);
  let habitDone = 0;
  D.habits.forEach(h => upto.forEach(d => { if (h.log[d]) habitDone++; }));
  return {
    days, planned, done, studyMin, postponed, perDay, goalsMoved, habitDone, habitPossible: D.habits.length * upto.length,
    pct: planned.length ? Math.round(done.length / planned.length * 100) : 0
  };
}

/* ================= smart planning ================= */
function stepsFor(f) {
  const subj = subjOf(f.subjectId);
  const title = (f.title || '').trim();
  const big = /project|assignment|report|lab\b/i.test(title) || (subj && /project|assignment/i.test(subj.name));
  if (big) return ['Read the brief and plan — 20 min', 'Do the main work — 60 min', 'Check it and submit — 20 min'];
  const topic = title.replace(/^(study|revise|revision|finish|complete|prepare|do|work on)\s+/i, '').trim() || (subj ? subj.name : 'the topic');
  return ['Revise ' + topic + ' theory — 45 min', 'Solve 10 problems — 45 min', 'Review mistakes — 20 min'];
}
function needsBreakdown(f, editing) {
  if (f.kind === 'event' || (f.subtasks && f.subtasks.length) || (f.title || '').trim().length < 3) return false;
  if ((f.duration || 0) >= 120) return true;
  if (editing) return false;
  const t = f.title.trim();
  const words = t.split(/\s+/).length;
  if (words <= 4 && /^(study|revise|revision|finish|complete|prepare|work on)\b/i.test(t)) return true;
  if (words <= 3 && /project|assignment|report/i.test(t)) return true;
  return D.subjects.some(s => s.name.toLowerCase() === t.toLowerCase()) && f.kind === 'study';
}

function planMyDay() {
  const td = today(), now = nowMin(), s = D.settings;
  const dayEnd = toMin(s.dayEnd);
  const cands = [];
  D.tasks.forEach(t => {
    if (isRec(t) || t.done || t.kind === 'event') return;
    const untimedToday = t.date === td && t.start == null;
    const unscheduled = !t.date;
    const overdue = (t.date && t.date < td) || (t.due && t.due < td);
    const dueSoon = !t.date && t.due && t.due <= addDays(td, 1);
    if (untimedToday || overdue || dueSoon || (unscheduled && t.priority === 'high')) cands.push(t);
  });
  cands.sort((a, b) => PR[a.priority] - PR[b.priority] || ((a.due || '9') < (b.due || '9') ? -1 : 1));
  const out = [];
  let from = Math.max(now + 5, toMin(s.dayStart)), total = 0;
  for (const t of cands) {
    if (out.length >= 4 || total >= 240) break;
    const dur = t.duration || s.defaultDuration;
    const slot = freeSlot(td, dur, from, t.id);
    if (slot == null || slot + dur > dayEnd) continue;
    out.push({ id: t.id, title: t.title, start: slot, dur });
    total += dur;
    from = slot + dur + 15; // leave a breather
    // reserve: temporarily treat as busy by nudging `from`; freeSlot re-reads real data, so nudge is enough
  }
  return out;
}

/* ================= natural-language quick add ================= */
const MONTH_RE = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const WD_FULL = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
function to24(h, m, ap) {
  h = +h; m = +(m || 0);
  if (ap) { ap = ap[0].toLowerCase(); if (ap === 'p' && h < 12) h += 12; if (ap === 'a' && h === 12) h = 0; }
  return h * 60 + m;
}
function guessHour(h, m) { // no am/pm given: 1-6 → pm, 7-11 → am, 12 → noon
  h = +h; m = +(m || 0);
  if (h >= 1 && h <= 6) h += 12;
  return h * 60 + m;
}
function nextWd(wd, sameWeekOk) {
  let d = today(); if (!sameWeekOk) d = addDays(d, 1);
  while (wdOf(d) !== wd) d = addDays(d, 1);
  return d;
}
function matchSubject(text) {
  const toks = (text.toLowerCase().match(/[a-z]+/g) || []);
  const STOP = ['and', 'of', 'the', 'to', 'in', 'for', 'my'];
  let best = null, bestScore = 0;
  D.subjects.forEach(sb => {
    const words = (sb.name.toLowerCase().match(/[a-z]+/g) || []).filter(w => w.length >= 2 && !STOP.includes(w));
    let score = 0;
    toks.forEach(tk => {
      words.forEach(w => {
        if (tk === w || tk === w + 's') score += 2;
        else if (tk.length >= 4 && (w.startsWith(tk) || (tk.endsWith('s') && w.startsWith(tk.slice(0, -1))))) score += 1;
      });
    });
    if (/^c\s/i.test(sb.name) && /\bC\b/.test(text)) score += 2;
    if (score > bestScore) { best = sb; bestScore = score; }
  });
  return best;
}

function parseQuick(raw) {
  const out = { found: false };
  let s = ' ' + raw + ' ';
  const cut = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };
  let m;
  if ((m = cut(/\s(?:high\s+priority|urgent|!high)(?=\s)/i))) out.priority = 'high';
  else if ((m = cut(/\s(?:low\s+priority|!low)(?=\s)/i))) out.priority = 'low';
  else if ((m = cut(/\s(?:medium\s+priority|!med(?:ium)?)(?=\s)/i))) out.priority = 'medium';

  /* time range */
  const T = '(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm|a\\.m\\.|p\\.m\\.)?';
  const rng = s.match(new RegExp('\\s(from\\s+)?' + T + '\\s*(?:to|-|–|—|till|until)\\s*' + T + '(?=[\\s,.]|$)', 'i'));
  if (rng && (rng[1] || rng[4] || rng[7] || rng[3] || rng[6])) {
    const [, , h1, m1, a1, h2, m2, a2] = rng;
    let a, b;
    if (a1 || a2) {
      b = to24(h2, m2, a2 || a1);
      a = to24(h1, m1, a1 || a2);
      if (!a1 && a >= b) a -= 720;
      if (a < 0) a += 720;
    } else { a = guessHour(h1, m1); b = guessHour(h2, m2); if (b <= a) b = a + 60; }
    if (b > a && a >= 0 && b <= 1440 + 60) {
      out.start = a; out.duration = b - a; s = s.replace(rng[0], ' ');
    }
  }
  if (out.start == null) {
    let t = s.match(/\s(?:at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?=[\s,.]|$)/i);
    if (t) out.start = t[3] ? to24(t[1], t[2], t[3]) : guessHour(t[1], t[2]);
    else if ((t = s.match(/\s(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=[\s,.]|$)/i))) out.start = to24(t[1], t[2], t[3]);
    else if ((t = s.match(/\s([01]?\d|2[0-3]):([0-5]\d)(?=[\s,.]|$)/))) out.start = to24(t[1], t[2]);
    if (t) s = s.replace(t[0], ' ');
  }
  if (out.duration == null) {
    let d = s.match(/\sfor\s+(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)(?=[\s,.]|$)/i)
      || s.match(/\s(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)(?=[\s,.]|$)/i);
    if (d) {
      const n = parseFloat(d[1]);
      out.duration = Math.round(/^h/i.test(d[2]) ? n * 60 : n);
      s = s.replace(d[0], ' ');
    }
  }
  if (out.duration != null && (out.duration < 5 || out.duration > 720)) delete out.duration;

  /* dates */
  const dateOut = (date, kw) => { if (kw && /due|by/i.test(kw)) out.due = date; else out.date = date; };
  let dm;
  if ((dm = cut(/\s(?:(due|by)\s+)?(today|tonight)(?=[\s,.]|$)/i))) dateOut(today(), dm[1]);
  else if ((dm = cut(/\s(?:(due|by)\s+)?(tomorrow|tmrw|tmr)(?=[\s,.]|$)/i))) dateOut(addDays(today(), 1), dm[1]);
  else if ((dm = cut(/\s(?:(due|by)\s+)?in\s+(\d{1,2})\s+days?(?=[\s,.]|$)/i))) dateOut(addDays(today(), +dm[2]), dm[1]);
  else if ((dm = cut(new RegExp('\\s(?:(due|by)\\s+)?(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+' + MONTH_RE + '(?=[\\s,.]|$)', 'i')))) {
    dateOut(monthDate(dm[3], dm[2]), dm[1]);
  } else if ((dm = cut(new RegExp('\\s(?:(due|by)\\s+)?(?:on\\s+)?' + MONTH_RE + '\\s+(\\d{1,2})(?:st|nd|rd|th)?(?=[\\s,.]|$)', 'i')))) {
    dateOut(monthDate(dm[2], dm[3]), dm[1]);
  } else if ((dm = cut(/\s(?:(due|by)\s+)?(?:(?:on|next|this)\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?=[\s,.]|$)/i))) {
    dateOut(nextWd(WD_FULL.indexOf(dm[2].toLowerCase()), false), dm[1]);
  } else if ((dm = cut(/\s(?:(due|by)\s+)?(?:on|next|this)\s+(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(?=[\s,.]|$)/i))) {
    const idx = WD_FULL.findIndex(w => w.startsWith(dm[2].toLowerCase().slice(0, 3)));
    dateOut(nextWd(idx, false), dm[1]);
  }

  /* subject, kind */
  const sb = matchSubject(s);
  if (sb) out.subjectId = sb.id;
  let title = s.replace(/\s+/g, ' ').trim();
  if (title !== raw.replace(/\s+/g, ' ').trim()) title = title.replace(/\s+(on|at|from|for|by|due|to|till|until)$/i, '').replace(/^(on|at|from)\s+/i, '').trim();
  if (/^(study|revise|revision|practice|solve|read|learn|review)\b/i.test(title)) out.kind = 'study';
  else if (/\b(lunch|break|dinner|breakfast|lecture|class|meeting|commute)\b/i.test(title)) out.kind = 'event';
  if (out.kind === 'study' && sb) {
    const rest = title.replace(/^study\s+/i, '');
    if (/^study\s+/i.test(title) && rest.toLowerCase() === sb.name.toLowerCase()) title = sb.name;
  }
  out.title = title;
  out.found = out.date != null || out.due != null || out.start != null || out.duration != null || !!out.subjectId || !!out.priority;
  out.timeFound = out.date != null || out.start != null;
  return out;
}
function monthDate(mon, day) {
  const mi = MONTHS.findIndex(m => m.toLowerCase().startsWith(mon.toLowerCase().slice(0, 3)));
  const now = new Date();
  let y = now.getFullYear();
  let d = new Date(y, mi, +day);
  if (ymd(d) < today()) d = new Date(y + 1, mi, +day);
  return ymd(d);
}

/* ================= shared view bits ================= */
const prioGlyph = p => `<span class="prio ${p}" title="${cap(p)} priority" role="img" aria-label="${cap(p)} priority"><i></i><i></i><i></i></span>`;
const subjColor = id => { const s = subjOf(id); return s ? s.color : null; };
const subjTag = id => { const s = subjOf(id); return s ? `<span class="st"><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>` : ''; };
const chkBtn = (on, id, d, label) => {
  const pulse = U.pulse && U.pulse === id + '@' + (d || '') ? ' pulse' : '';
  return `<button class="chk ${on ? 'on' : ''}${pulse}" data-a="toggle" data-id="${id}" data-d="${d}" aria-pressed="${on}" aria-label="${on ? 'Mark not done: ' : 'Mark done: '}${esc(label)}">${ico('check')}</button>`;
};
const bar = (pct, cls = '') => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
const pageHead = (title, sub, actions) => `<div class="page-head"><div><h1 class="page-title">${esc(title)}</h1>${sub ? `<p class="page-sub">${sub}</p>` : ''}</div><div class="chips">${actions || ''}</div></div>`;
const addBtn = (label, attrs = '') => `<button class="btn btn-primary" data-a="add" ${attrs}>${ico('plus')}${label}</button>`;
/* a div that behaves like a button for pointer *and* keyboard users */
const openable = (attrs, inner, label) => `<div class="tb" role="button" tabindex="0" ${attrs} aria-label="${esc(label)}">${inner}</div>`;

/* ---------------------------------------------------------------
   taskRow — one row, progressive disclosure.
   Shows at most: time/duration · subject · one status note.
   Everything else waits until the task is opened.
   --------------------------------------------------------------- */
function taskRow(i, o = {}) {
  const t = i.t, done = i.done, td = today();
  const late = !done && !isRec(t) && ((t.date && t.date < td) || (t.due && t.due < td));
  const meta = [];

  if (late) meta.push(`<span class="t-red">Overdue · ${esc(relLabel(i.d))}</span>`);
  else if (o.showDate && i.d) meta.push(`<span>${esc(relLabel(i.d))}</span>`);

  if (i.start != null) meta.push(`<span class="${done ? '' : 't-blue'} num">${fmtRange(i.start, i.end)}</span>`);
  else if (t.duration && !o.noDur && t.kind !== 'event' && !done) meta.push(`<span class="num">${fmtDur(t.duration)}</span>`);

  if (t.subjectId) meta.push(subjTag(t.subjectId));

  if (t.due && !done && !late) {
    const n = diffDays(td, t.due);
    if (n <= 7 || o.showDate) meta.push(`<span class="${n <= 1 ? 't-orange' : ''}">${dueLabel(t.due)}</span>`);
  }
  if (isRec(t)) meta.push(`<span class="st">${ico('repeat')}${esc(recurText(t))}</span>`);
  if (o.showGoal && t.goalId && goalOf(t.goalId)) meta.push(`<span class="st">${ico('goals')}${esc(goalOf(t.goalId).title)}</span>`);
  if (done && o.showDone) {
    const st = isRec(t) ? (t.doneDates || {})[i.d] : t.doneAt;
    if (st && st.length > 10) meta.push(`<span class="t-green">Done ${fmtT(toMin(st.slice(11)))}</span>`);
  }

  const subs = t.subtasks || [], sd = subs.filter(s => s.done).length, ek = i.key;
  if (subs.length) meta.push(`<button data-a="expand" data-k="${ek}" aria-expanded="${!!U.expanded[ek]}">${sd}/${subs.length} steps</button>`);

  const sublist = subs.length && U.expanded[ek]
    ? `<ul class="subs sublist">${subs.map(s => `<li class="${s.done ? 'done' : ''}"><button class="chk sm ${s.done ? 'on' : ''}" data-a="sub" data-id="${t.id}" data-sid="${s.id}" aria-label="Toggle step">${ico('check')}</button><span>${esc(s.text)}</span></li>`).join('')}</ul>`
    : '';

  const drag = o.reorder ? ` draggable="true" data-reorder="${t.id}"` : '';
  const body = `<div class="ttl">${esc(t.title)}</div><div class="tm">${meta.join('')}</div>${sublist}`;

  return `<li class="task p-${t.priority} ${done ? 'done' : ''} ${late ? 'over' : ''}"${drag}>
    ${t.kind === 'event' ? '<span style="width:20px;flex:none"></span>' : chkBtn(done, t.id, i.d, t.title)}
    ${openable(`data-a="edit" data-id="${t.id}" data-d="${i.d || ''}"`, body, 'Open ' + t.title)}
    <span class="pr">${done || t.kind === 'event' ? '' : prioGlyph(t.priority)}</span>
  </li>`;
}

function recurText(t) {
  const r = t.recur || {};
  if (r.type === 'daily') return 'Daily';
  if (r.type === 'weekly') return 'Weekly';
  if (r.type === 'custom') return (r.days || []).slice().sort().map(d => DAYS[d].slice(0, 3)).join(', ') || 'Custom';
  return '';
}

const emptyBox = (title, text, acts, tight) => `<div class="empty ${tight ? 'tight' : ''}"><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;

/* deadline list, shared by Today / Subjects / Review */
function dlList(items, td) {
  return `<ul class="dl">${items.map(d => {
    const n = diffDays(td, d.date);
    const when = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : relLabel(d.date);
    const cls = n <= 0 ? 'r' : n <= 2 ? 'o' : '';
    const kind = d.kind === 'exam' ? 'exam' : d.kind === 'goal' ? 'goal' : '';
    return `<li data-a="${d.kind === 'task' ? 'edit' : 'nav'}" data-id="${d.id}" data-d="" data-p="${d.kind === 'exam' ? 'exams' : 'goals'}" role="button" tabindex="0">
      <span class="ttl">${esc(d.title)}</span>
      ${kind ? `<span class="kind ${kind}">${kind === 'exam' ? 'Exam' : 'Goal'}</span>` : ''}
      <span class="when ${cls}">${when}</span></li>`;
  }).join('')}</ul>`;
}

/* ================= TODAY ================= */
function viewToday() {
  const td = today(), now = nowMin();
  const items = dayInst(td);
  const timed = items.filter(i => i.start != null).sort((a, b) => a.start - b.start);
  const checks = items.filter(i => i.kind !== 'event');
  const doneN = checks.filter(i => i.done).length, total = checks.length;
  const pct = total ? Math.round(doneN / total * 100) : 0;
  const overdue = overdueList();
  const active = timed.filter(i => !i.done && i.start <= now && now < i.end);
  const cur = active.find(i => i.kind !== 'event') || active[0] || null;
  const next = timed.find(i => !i.done && i.start > now && (!cur || i.key !== cur.key)) || null;
  const openToday = checks.filter(i => !i.done);

  /* ---- header: date, live clock, progress ---- */
  const dd = pd(td);
  const head = `<header class="t-head">
    <div>
      <div class="t-eyebrow">${DAYS[wdOf(td)]}</div>
      <h1 class="t-date">${MONTHS[dd.getMonth()]} ${dd.getDate()}</h1>
      <div class="t-time"><span id="clock">${fmtT(now)}</span></div>
    </div>
    <div class="t-prog">
      <div class="txt"><span>Today's progress</span><b class="num">${doneN}<span class="muted"> / ${total}</span></b></div>
      ${bar(pct, 'green')}
    </div>
  </header>`;

  /* ---- notices ---- */
  let notice = '';
  if (D.sample) notice += `<div class="notice"><span class="grow">This is sample data, so you can see how everything fits together. Clear it when you're ready for your own.</span><button class="btn btn-sm" data-a="clear-sample">Start fresh</button></div>`;
  if (!storageOK) notice += `<div class="notice warn"><span class="grow">This browser isn't saving changes. Use Settings → Export backup to keep your data.</span></div>`;

  /* ---- carry-over banners ---- */
  let cards = '';
  if (overdue.length) {
    cards += `<div class="wrap-card red"><div class="grow"><b>${overdue.length} overdue ${overdue.length === 1 ? 'task' : 'tasks'}</b><div class="sub">${esc(overdue.slice(0, 2).map(i => i.t.title).join(', '))}${overdue.length > 2 ? ' and more' : ''}</div></div>
      <div class="acts"><button class="btn btn-sm" data-a="carry" data-scope="overdue" data-to="today">Move to today</button><button class="btn btn-sm" data-a="carry" data-scope="overdue" data-to="pick">Pick a date</button><button class="btn btn-sm btn-quiet" data-a="carry" data-scope="overdue" data-to="none">Unschedule</button></div></div>`;
  }
  const eod = now >= toMin(D.settings.dayEnd) - 60;
  if (openToday.length && (eod || U.wrap)) {
    cards += `<div class="wrap-card orange"><div class="grow"><b>${openToday.length} unfinished ${openToday.length === 1 ? 'task' : 'tasks'}</b><div class="sub">Move them now so tomorrow doesn't start behind.</div></div>
      <div class="acts"><button class="btn btn-sm" data-a="carry" data-scope="today" data-to="tomorrow">Move to tomorrow</button><button class="btn btn-sm" data-a="carry" data-scope="today" data-to="pick">Pick a date</button><button class="btn btn-sm btn-quiet" data-a="carry" data-scope="today" data-to="none">Unschedule</button>${!eod ? `<button class="icon-btn" data-a="wrap-off" aria-label="Dismiss">${ico('x')}</button>` : ''}</div></div>`;
  }

  /* ---- NOW ---- */
  let nowHtml;
  if (cur) {
    const elapsed = Math.min(100, Math.max(0, Math.round((now - cur.start) / cur.dur * 100)));
    const left = cur.end - now;
    const subs = cur.t.subtasks || [];
    nowHtml = `<section class="now" aria-label="Happening now">
      <div class="now-top"><span class="pill pill-blue">Now</span><span class="now-left">${minsLabel(left)} left</span></div>
      <h2 class="now-title">${esc(cur.t.title)}</h2>
      <div class="now-meta"><span class="num">${fmtRange(cur.start, cur.end)}</span>${cur.t.subjectId ? subjTag(cur.t.subjectId) : ''}${cur.kind === 'event' ? '<span>Scheduled event</span>' : ''}</div>
      ${bar(elapsed)}
      ${subs.length ? `<ul class="subs">${subs.map(s => `<li class="${s.done ? 'done' : ''}"><button class="chk sm ${s.done ? 'on' : ''}" data-a="sub" data-id="${cur.id}" data-sid="${s.id}" aria-label="Toggle step">${ico('check')}</button><span>${esc(s.text)}</span></li>`).join('')}</ul>` : ''}
      <div class="now-actions">${cur.kind !== 'event'
        ? `<button class="btn btn-primary" data-a="toggle" data-id="${cur.id}" data-d="${cur.d}">${ico('check')}Mark done</button><button class="btn" data-a="resched" data-id="${cur.id}" data-d="${cur.d}">Reschedule</button>`
        : `<button class="btn" data-a="edit" data-id="${cur.id}" data-d="${cur.d}">Edit</button>`}</div>
    </section>`;
  } else {
    let msg, sub = '', acts = '';
    if (total && openToday.length === 0) { msg = 'All done for today.'; sub = 'Everything on today\'s list is finished.'; }
    else if (!items.length && !overdue.length) { msg = ''; }
    else {
      msg = 'Nothing scheduled right now';
      sub = next ? `Free until ${fmtT(next.start)}.` : 'Nothing else is scheduled today.';
      const upFirst = openToday.filter(i => i.start == null).sort((a, b) => PR[a.t.priority] - PR[b.t.priority])[0];
      if (upFirst) acts = `<p class="now-hint">Good time for <b>${esc(upFirst.t.title)}</b></p><div class="now-actions"><button class="btn" data-a="edit" data-id="${upFirst.id}" data-d="${upFirst.d}">Open it</button><button class="btn btn-quiet" data-a="plan-day">${ico('sparkle')}Plan my day</button></div>`;
      else if (openToday.length === 0 && !next) acts = `<div class="now-actions"><button class="btn" data-a="plan-day">${ico('sparkle')}Plan my day</button><button class="btn btn-quiet" data-a="add">${ico('plus')}Add a task</button></div>`;
    }
    nowHtml = msg ? `<section class="now now-idle" aria-label="Happening now"><div class="now-top"><span class="pill">Now</span></div><h2 class="now-title">${msg}</h2>${sub ? `<p>${sub}</p>` : ''}${acts}</section>` : '';
  }

  /* ---- NEXT ---- */
  let nextHtml = '';
  if (next) {
    nextHtml = `<section class="next" aria-label="Up next" data-a="edit" data-id="${next.id}" data-d="${next.d}" role="button" tabindex="0"><span class="pill pill-orange">Next</span>
      <div class="grow"><div class="nt">${esc(next.t.title)}</div><div class="nm num">${fmtRange(next.start, next.end)} · in ${minsLabel(next.start - now)}</div></div>
      ${ico('right')}</section>`;
  } else if (cur || nowHtml) {
    const tm = dayInst(addDays(td, 1)).filter(i => i.start != null && i.kind !== 'event').sort((a, b) => a.start - b.start)[0];
    if (tm && !openToday.length) nextHtml = `<section class="next"><span class="pill pill-orange">Next</span><div class="grow"><div class="nt">${esc(tm.t.title)}</div><div class="nm">Tomorrow, ${fmtT(tm.start)}</div></div></section>`;
  }

  /* ---- today's tasks ---- */
  const openList = items.filter(i => i.kind !== 'event' && !i.done).sort(byTime);
  const timedOpen = openList.filter(i => i.start != null);
  const untimed = openList.filter(i => i.start == null).sort((a, b) => (a.t.order || 0) - (b.t.order || 0) || PR[a.t.priority] - PR[b.t.priority]);
  const doneList = checks.filter(i => i.done).sort((a, b) => (a.start || 0) - (b.start || 0));

  let tasksHtml = '';
  if (!checks.length && !overdue.length) {
    tasksHtml = emptyBox('Your day is clear.', 'Nothing is planned for today yet.',
      `<button class="btn btn-primary" data-a="plan-day">${ico('sparkle')}Plan my day</button><button class="btn" data-a="add">${ico('plus')}Add a task</button>`);
  } else {
    const secs = [];
    if (overdue.length) secs.push(`<div class="sub-h">Overdue <span class="n">${overdue.length}</span></div><ul class="tlist">${overdue.map(i => taskRow(i)).join('')}</ul>`);
    if (timedOpen.length) secs.push(`${overdue.length ? '<div class="sub-h">Scheduled</div>' : ''}<ul class="tlist">${timedOpen.map(i => taskRow(i)).join('')}</ul>`);
    if (untimed.length) secs.push(`<div class="sub-h">Anytime today <span class="n">${untimed.length}</span></div><ul class="tlist">${untimed.map(i => taskRow(i, { reorder: true })).join('')}</ul>`);
    if (!secs.length) secs.push(`<div class="empty tight"><h3>Nothing left to do today.</h3><p>Every task on today's list is done.</p></div>`);
    if (doneList.length) secs.push(`<div class="sub-h">Completed <span class="n">${doneList.length}</span></div><ul class="tlist">${doneList.map(i => taskRow(i, { showDone: true })).join('')}</ul>`);
    tasksHtml = secs.join('');
  }

  const canPlan = planMyDay().length > 0;
  const wrapLink = [
    canPlan ? `<button class="link" data-a="plan-day">Plan my day</button>` : '',
    openToday.length && !(eod || U.wrap) ? `<button class="link" data-a="wrap">Wrap up</button>` : ''
  ].filter(Boolean).join(' &nbsp; ');

  /* ---- schedule timeline ---- */
  const tl = timed.length ? `<ol class="tl">${timed.map(i => {
    const isNow = cur && cur.key === i.key, past = i.end <= now && !i.done;
    const cls = [i.kind === 'event' ? 'ev' : '', i.done ? 'done' : '', past ? 'past' : '', isNow ? 'now' : ''].join(' ');
    const sb = subjOf(i.t.subjectId);
    const sbName = sb && sb.name.toLowerCase() !== i.t.title.toLowerCase() ? ' · ' + esc(sb.name) : '';
    return `<li class="${cls}" data-a="edit" data-id="${i.id}" data-d="${i.d}" role="button" tabindex="0"><span class="tt num">${fmtT(i.start)}</span><span class="mk"><i></i></span><div><div class="ttl">${esc(i.t.title)}</div><div class="sm">${fmtDur(i.dur)}${sbName}</div></div></li>`;
  }).join('')}</ol>` : `<p class="muted" style="font-size:14px">Nothing has a time yet. Give a task a start time and it appears here.</p>`;

  /* ---- deadlines ---- */
  const dls = deadlines(6);
  const dlHtml = dls.length ? dlList(dls, td) : `<p class="muted" style="font-size:14px">No deadlines coming up.</p>`;

  /* ---- needs attention ---- */
  const att = attention().filter(a => a.kind !== 'overdue').slice(0, 3);
  const remHtml = att.length ? `<section><h2 class="h2">Needs attention</h2><ul class="rem">${att.map(a => `<li class="k-${a.kind}">${ico('alert')}<div class="grow"><div>${esc(a.text)}</div><div class="rs">${esc(a.sub)}</div></div><button class="btn btn-sm btn-quiet" data-a="${a.a}" data-id="${a.id || ''}" data-d="${a.d || ''}" data-p="${a.p || ''}">${a.label}</button></li>`).join('')}</ul></section>` : '';

  /* ---- habits ---- */
  const hab = D.habits.length ? `<section><h2 class="h2">Habits<button class="link aux" data-a="nav" data-p="habits">Open</button></h2><div class="hab-mini">${D.habits.map(h => `<button class="${h.log[td] ? 'on' : ''}" data-a="habit" data-id="${h.id}" data-d="${td}" aria-pressed="${!!h.log[td]}"><span class="chk sm ${h.log[td] ? 'on' : ''}">${ico('check')}</span>${esc(h.name)}</button>`).join('')}</div></section>` : '';

  return `${notice}${head}${cards}
  <div class="grid-2">
    <div class="col-stack">
      <div>${nowHtml}${nextHtml}</div>
      <section><h2 class="h2">Today's tasks ${wrapLink ? `<span class="aux">${wrapLink}</span>` : ''}</h2>${tasksHtml}</section>
    </div>
    <div class="col-stack">
      <section><h2 class="h2">Schedule</h2>${tl}</section>
      <section><h2 class="h2">Upcoming<button class="link aux" data-a="tf" data-s="upcoming">See all</button></h2>${dlHtml}</section>
      ${remHtml}
      ${hab}
    </div>
  </div>`;
}

/* ================= PLANNER ================= */
const HH = 52;
let gridMeta = { gs: 0 };

function plannerTitle() {
  const d = U.pd;
  if (U.pv === 'day') return fmtLong(d);
  if (U.pv === 'month') return MONTHS[pd(d).getMonth()] + ' ' + pd(d).getFullYear();
  const days = weekDays(d), a = pd(days[0]), b = pd(days[6]);
  if (a.getMonth() === b.getMonth()) return MONTHS[a.getMonth()] + ' ' + a.getDate() + ' – ' + b.getDate();
  return fmtShort(days[0]) + ' – ' + fmtShort(days[6]);
}

function layoutDay(list) {
  const items = list.slice().sort((a, b) => a.start - b.start || b.end - a.end);
  const out = [];
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    cluster.forEach(it => {
      let l = lanes.findIndex(e => e <= it.start);
      if (l < 0) { l = lanes.length; lanes.push(0); }
      lanes[l] = it.end; it.lane = l;
    });
    cluster.forEach(it => { it.lanes = lanes.length; });
    out.push(...cluster); cluster = [];
  };
  items.forEach(it => {
    if (cluster.length && it.start >= clusterEnd) { flush(); clusterEnd = -1; }
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end);
  });
  if (cluster.length) flush();
  return out;
}

function viewPlanner() {
  const v = U.pv, td = today();
  const isNow = v === 'month' ? U.pd.slice(0, 7) === td.slice(0, 7) : weekDays(U.pd).includes(td);
  const head = `<div class="pl-bar">
    <h1 class="pl-title">${esc(plannerTitle())}</h1>
    <div class="pl-nav">
      <button class="icon-btn" data-a="pl" data-n="-1" aria-label="Previous">${ico('left')}</button>
      <button class="icon-btn" data-a="pl" data-n="1" aria-label="Next">${ico('right')}</button>
    </div>
    ${isNow && v !== 'day' ? '' : `<button class="btn btn-sm" data-a="pl-today">Today</button>`}
    <span class="grow"></span>
    <div class="seg" role="tablist">${['day', 'week', 'month'].map(k => `<button class="${v === k ? 'on' : ''}" data-a="pl-view" data-v="${k}" role="tab" aria-selected="${v === k}">${cap(k)}</button>`).join('')}</div>
    ${addBtn('Add', `data-date="${U.pd}"`)}
  </div>`;
  if (v === 'month') return head + monthHtml();
  const days = v === 'day' ? [U.pd] : weekDays(U.pd);
  const strip = v === 'day'
    ? `<div class="day-strip">${weekDays(U.pd).map(d => `<button class="${d === U.pd ? 'on' : ''} ${d === td ? 'today' : ''}" data-a="pl-goto" data-d="${d}">${DAYS[wdOf(d)].slice(0, 3)}<b>${pd(d).getDate()}</b></button>`).join('')}</div>`
    : '';
  return head + strip + gridHtml(days);
}

function gridHtml(days) {
  const s = D.settings, td = today(), n = days.length;
  const ds = toMin(s.dayStart), de = toMin(s.dayEnd);
  let gs = Math.floor(ds / 60) * 60, ge = Math.ceil(de / 60) * 60;
  const per = days.map(d => dayInst(d));
  per.forEach(list => list.forEach(i => {
    if (i.start != null) { gs = Math.min(gs, Math.floor(i.start / 60) * 60); ge = Math.max(ge, Math.min(1440, Math.ceil(i.end / 60) * 60)); }
  }));
  gridMeta = { gs, ge };
  const H = (ge - gs) / 60 * HH, now = nowMin();
  const y = m => (m - gs) / 60 * HH;

  /* hour rail — every hour, quiet and tabular */
  const hours = [];
  for (let m = gs; m < ge; m += 60) {
    const lbl = fmtT(m).replace(':00', '').toLowerCase().replace(' ', '');
    hours.push(`<span class="hl ${m === gs ? 'first' : ''}" style="top:${y(m)}px">${lbl}</span>`);
  }

  /* day headers */
  const heads = days.map(d => {
    const wknd = wdOf(d) >= 5;
    return `<div class="dh ${d === td ? 'today' : ''} ${wknd && d !== td ? 'dim' : ''}" data-a="pl-goto" data-d="${d}" role="button" tabindex="0" aria-label="Open ${fmtLong(d)}">
      <div class="dw">${DAYS[wdOf(d)].slice(0, 3)}</div><div class="dn num">${pd(d).getDate()}</div></div>`;
  }).join('');

  /* untimed lane */
  const lanes = days.map((d, k) => {
    const un = per[k].filter(i => i.start == null && i.kind !== 'event').sort((a, b) => (a.t.order || 0) - (b.t.order || 0));
    return `<div class="lane" data-lane="${d}">${un.map(i => {
      const late = !i.done && d < td && !isRec(i.t);
      const c = subjColor(i.t.subjectId);
      return `<div class="lchip ${i.done ? 'done' : ''} ${late ? 'late' : ''}" ${c ? `style="--bc:${c}"` : ''} data-chip="${i.id}" data-d="${d}" data-a="edit" data-id="${i.id}"><button class="chk sm ${i.done ? 'on' : ''}" data-a="toggle" data-id="${i.id}" data-d="${d}" aria-label="Toggle ${esc(i.t.title)}">${ico('check')}</button><span class="tx">${esc(i.t.title)}</span></div>`;
    }).join('')}</div>`;
  }).join('');

  /* columns */
  const cols = days.map((d, k) => {
    const list = layoutDay(per[k].filter(i => i.start != null));
    const nextKey = d === td ? (per[k].filter(i => i.start != null && !i.done && i.start > now && i.kind !== 'event').sort((a, b) => a.start - b.start)[0] || {}).key : null;

    /* quiet shading outside the working day, so the useful hours read first */
    let off = '';
    if (ds > gs) off += `<div class="offh" style="top:0;height:${y(ds)}px"></div>`;
    if (de < ge) off += `<div class="offh" style="top:${y(de)}px;height:${H - y(de)}px"></div>`;

    const blocks = list.map(i => {
      const top = y(i.start), h = Math.max(20, i.dur / 60 * HH - 3);
      const late = !i.done && i.kind !== 'event' && !isRec(i.t) && d < td;
      const size = h < 30 ? 'xs' : h >= 62 ? 'lg' : '';
      const c = subjColor(i.t.subjectId);
      const cls = ['blk', size, i.kind === 'event' ? 'ev' : '', i.done ? 'done' : '', late ? 'late' : '', nextKey === i.key ? 'nx' : ''].join(' ');
      const style = `top:${top}px;height:${h}px;left:calc(${i.lane} / ${i.lanes} * 100% + 2px);width:calc(100% / ${i.lanes} - 4px)${c ? ';--bc:' + c : ''}`;
      return `<div class="${cls}" tabindex="0" data-blk="${i.id}" data-d="${d}" data-a="edit" data-id="${i.id}" style="${style}" aria-label="${esc(i.t.title)}, ${fmtRange(i.start, i.end)}">
        <div class="b-t">${esc(i.t.title)}</div>${size !== 'xs' ? `<div class="b-m num">${fmtRange(i.start, i.end)}</div>` : ''}<i class="rz" data-rz></i></div>`;
    }).join('');

    const nl = d === td && now >= gs && now <= ge ? `<div class="nowline" id="nowline" style="top:${y(now)}px"></div>` : '';
    return `<div class="col ${d === td ? 'today' : ''}" data-col="${d}" style="height:${H}px">${off}${blocks}${nl}</div>`;
  }).join('');

  return `<div class="wk ${n === 1 ? 'one' : ''}" style="--n:${n};--hh:${HH}px"><div class="wk-scroll" id="wkscroll" data-gs="${gs}"><div class="wk-in">
    <div class="wk-sticky"><div class="wk-row wk-head"><div class="gut"></div>${heads}</div>
    <div class="wk-row wk-lane"><div class="gut">To do</div>${lanes}</div></div>
    <div class="wk-row wk-body"><div class="gut" style="height:${H}px">${hours.join('')}</div>${cols}</div>
  </div></div></div>`;
}

/* ---------------------------------------------------------------
   Month — answers "what is happening this month?" and little else.
   Chips for the first few items, coloured flags for the rest.
   --------------------------------------------------------------- */
function monthHtml() {
  const first = U.pd.slice(0, 8) + '01', td = today();
  const start = weekStartOf(first), month = pd(U.pd).getMonth();
  const hdr = Array.from({ length: 7 }, (_, i) => `<div>${DAYS[wdOf(addDays(start, i))].slice(0, 3)}</div>`).join('');

  /* index exams & goal deadlines by date so cells can flag them */
  const examOn = {}, goalOn = {};
  D.exams.forEach(e => { examOn[e.date] = true; });
  D.goals.forEach(g => { if (g.deadline) goalOn[g.deadline] = true; });

  const cells = [];
  for (let k = 0; k < 42; k++) {
    const d = addDays(start, k);
    if (k >= 35 && pd(d).getMonth() !== month) break;
    const list = dayInst(d).sort(byTime);
    const shown = list.slice(0, 3), more = list.length - shown.length;
    const dueHere = D.tasks.some(t => !isRec(t) && !t.done && t.due === d && t.kind !== 'event');

    const flags = [
      examOn[d] ? '<i class="exam" title="Exam"></i>' : '',
      goalOn[d] ? '<i class="goal" title="Goal deadline"></i>' : '',
      dueHere ? '<i class="due" title="Something is due"></i>' : ''
    ].join('');

    cells.push(`<div class="mcell ${pd(d).getMonth() !== month ? 'out' : ''} ${d === td ? 'today' : ''}" data-mcell="${d}" data-a="add" data-date="${d}">
      <div class="mrow">
        <button class="mn" data-a="pl-goto" data-d="${d}" aria-label="Open ${fmtLong(d)}">${pd(d).getDate()}</button>
        ${flags ? `<span class="mflags">${flags}</span>` : ''}
      </div>
      ${shown.map(i => {
        const late = !i.done && i.kind !== 'event' && !isRec(i.t) && d < td;
        const c = subjColor(i.t.subjectId);
        const tm = i.start != null ? `<b>${fmtT(i.start).replace(':00', '').replace(' ', '').toLowerCase()}</b>` : '';
        return `<div class="mchip ${i.done ? 'done' : ''} ${late ? 'late' : ''}" ${c ? `style="--bc:${c}"` : ''} draggable="true" data-mchip="${i.id}" data-d="${d}" data-a="edit" data-id="${i.id}"><span class="tx">${tm}${esc(i.t.title)}</span></div>`;
      }).join('')}${more > 0 ? `<div class="mmore">+${more} more</div>` : ''}</div>`);
  }
  return `<div class="month"><div class="month-h">${hdr}</div><div class="month-g">${cells.join('')}</div></div>`;
}

/* ================= TASKS ================= */
const SORTS = [['smart', 'Smart order'], ['priority', 'Priority'], ['due', 'Due date'], ['title', 'Name']];

function matchesQuery(t) {
  const q = (U.tf.q || '').trim().toLowerCase();
  if (!q) return true;
  if ((t.title || '').toLowerCase().includes(q)) return true;
  if ((t.notes || '').toLowerCase().includes(q)) return true;
  if ((t.subtasks || []).some(s => (s.text || '').toLowerCase().includes(q))) return true;
  const sb = subjOf(t.subjectId);
  if (sb && sb.name.toLowerCase().includes(q)) return true;
  const g = goalOf(t.goalId);
  if (g && g.title.toLowerCase().includes(q)) return true;
  return false;
}

function sortInst(list) {
  const mode = U.tf.sort || 'smart';
  if (mode === 'smart') return list;
  const l = list.slice();
  if (mode === 'priority') l.sort((a, b) => PR[a.t.priority] - PR[b.t.priority] || byTime(a, b));
  else if (mode === 'due') l.sort((a, b) => ((a.t.due || a.d || '9999') < (b.t.due || b.d || '9999') ? -1 : 1));
  else if (mode === 'title') l.sort((a, b) => a.t.title.localeCompare(b.t.title));
  return l;
}

function taskEntries(status) {
  const td = today(), out = [];
  const subj = U.tf.subject, pr = U.tf.priority;
  const ok = t => t.kind !== 'event' && (!subj || t.subjectId === subj) && (!pr || t.priority === pr) && matchesQuery(t);
  const S = list => sortInst(list);

  const overdue = overdueList().filter(i => ok(i.t));
  if (status === 'overdue') return { list: overdue, groups: [['Overdue', S(overdue)]] };
  if (status === 'done') {
    const list = [];
    D.tasks.filter(ok).forEach(t => {
      if (isRec(t)) Object.keys(t.doneDates || {}).forEach(d => list.push({ i: inst(t, d), at: t.doneDates[d] }));
      else if (t.done) list.push({ i: inst(t, t.date || (t.doneAt || '').slice(0, 10) || td), at: t.doneAt || '' });
    });
    list.sort((a, b) => (a.at < b.at ? 1 : -1));
    return { list: list.map(x => x.i), groups: [['Completed', list.slice(0, 80).map(x => x.i)]] };
  }
  const todayL = dayInst(td).filter(i => ok(i.t) && i.kind !== 'event');
  const upcoming = D.tasks.filter(t => ok(t) && !isRec(t) && !t.done && t.date && t.date > td).map(t => inst(t, t.date)).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : byTime(a, b));
  const nodate = D.tasks.filter(t => ok(t) && !isRec(t) && !t.done && !t.date).map(t => inst(t, '')).sort((a, b) => PR[a.t.priority] - PR[b.t.priority]);
  const reps = D.tasks.filter(t => ok(t) && isRec(t) && t.kind !== 'event').map(t => inst(t, t.date));
  if (status === 'today') return { list: todayL, groups: [['Today', S(todayL.slice().sort(byTime))]] };

  const byDay = {};
  upcoming.forEach(i => { (byDay[i.d] = byDay[i.d] || []).push(i); });
  const dayGroups = Object.keys(byDay).sort().map(d => [relLabel(d) + (diffDays(td, d) > 1 && diffDays(td, d) < 7 ? ' · ' + fmtShort(d) : ''), S(byDay[d])]);

  if (status === 'upcoming') return { list: upcoming.concat(nodate), groups: dayGroups.concat([['No date', S(nodate)], ['Repeating', S(reps)]]) };
  const g = [['Overdue', S(overdue)], ['Today', S(todayL.slice().sort(byTime))]].concat(dayGroups).concat([['No date', S(nodate)], ['Repeating', S(reps)]]);
  return { list: overdue.concat(todayL, upcoming, nodate), groups: g };
}

function viewTasks() {
  const st = U.tf.status, q = U.tf.q || '';
  const counts = {
    all: taskEntriesCount('all'), today: taskEntriesCount('today'), upcoming: taskEntriesCount('upcoming'),
    overdue: taskEntriesCount('overdue'), done: taskEntriesCount('done')
  };
  const chips = [['all', 'All open'], ['today', 'Today'], ['upcoming', 'Upcoming'], ['overdue', 'Overdue'], ['done', 'Completed']]
    .map(([k, l]) => `<button class="chip ${st === k ? 'on' : ''}" data-a="tf-status" data-s="${k}">${l}${counts[k] ? ` <span class="n">${counts[k]}</span>` : ''}</button>`).join('');

  const search = `<div class="search">${ico('search')}<input class="input" id="tq" type="search" data-set="tf-q" value="${esc(q)}" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
    ${q ? `<button class="icon-btn clr" data-a="tf-clear" aria-label="Clear search">${ico('x')}</button>` : ''}</div>`;
  const subjSel = `<select class="select" data-set="tf-subject" aria-label="Filter by subject"><option value="">All subjects</option>${D.subjects.map(s => `<option value="${s.id}" ${U.tf.subject === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;
  const prSel = `<select class="select" data-set="tf-priority" aria-label="Filter by priority"><option value="">Any priority</option>${['high', 'medium', 'low'].map(p => `<option value="${p}" ${U.tf.priority === p ? 'selected' : ''}>${cap(p)}</option>`).join('')}</select>`;
  const sortSel = `<select class="select" data-set="tf-sort" aria-label="Sort by">${SORTS.map(([v, l]) => `<option value="${v}" ${(U.tf.sort || 'smart') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;

  const { groups } = taskEntries(st);
  const shown = groups.filter(g => g[1].length);
  let body;
  if (!shown.length) {
    body = q
      ? emptyBox('No matches for “' + esc(q) + '”.', 'Try a different word, or clear the filters.', `<button class="btn" data-a="tf-clear">Clear search</button>`, true)
      : st === 'overdue' ? emptyBox('Nothing overdue.', 'You\'re on top of it.', '', true)
      : st === 'done' ? emptyBox('Nothing completed yet.', 'Finished tasks collect here.', '', true)
      : emptyBox('No tasks here.', 'Add one and it shows up in this list.', `<button class="btn btn-primary" data-a="add">${ico('plus')}Add a task</button>`, true);
  } else {
    body = shown.map(([label, list]) => `<section class="grp"><div class="grp-h ${label === 'Overdue' ? 'red' : ''}">${esc(label)}<span class="n">${list.length}</span></div><ul class="tlist">${list.map(i => taskRow(i, { showDate: st === 'done' || label === 'Overdue' || label === 'Repeating', showGoal: true, showDone: st === 'done' })).join('')}</ul></section>`).join('');
  }
  return pageHead('Tasks', 'Everything you need to do, in one list.', addBtn('New task')) +
    `<div class="filters">${search}${subjSel}${prSel}${sortSel}</div><div class="filters">${chips}</div>${body}`;
}

function taskEntriesCount(status) {
  return taskEntries(status).list.length;
}

/* ================= SUBJECTS ================= */
function viewSubjects() {
  if (U.subj && subjOf(U.subj)) return viewSubjectDetail(subjOf(U.subj));
  U.subj = null;
  const td = today();
  const rows = D.subjects.map(s => {
    const st = subjStats(s.id);
    const nx = D.tasks.filter(t => t.subjectId === s.id && !isRec(t) && !t.done && t.due && t.due >= td).sort((a, b) => a.due < b.due ? -1 : 1)[0];
    const bits = [st.open + ' open'];
    if (st.done) bits.push(st.done + ' done');
    if (nx) bits.push('Next: ' + nx.title + ', ' + relLabel(nx.due).toLowerCase());
    return `<li class="row" data-a="subj-open" data-id="${s.id}" role="button" tabindex="0">
      <i class="dot" style="background:${s.color};width:10px;height:10px"></i>
      <div class="grow"><div class="r-t">${esc(s.name)}</div><div class="r-m">${esc(bits.join(' · '))}</div></div>
      <div class="r-side">${bar(st.pct, 'green')}<div class="mini"><span>Progress</span><span class="num">${st.pct}%</span></div></div></li>`;
  }).join('');
  return pageHead('Subjects', 'Every area of your college life, with its own progress.', `<button class="btn btn-primary" data-a="subj-new">${ico('plus')}New subject</button>`) +
    (rows ? `<ul class="rows">${rows}</ul>` : emptyBox('No subjects yet.', 'Create one for each class or area of your life.', `<button class="btn btn-primary" data-a="subj-new">${ico('plus')}New subject</button>`));
}

function viewSubjectDetail(s) {
  const td = today(), st = subjStats(s.id);
  const all = D.tasks.filter(t => t.subjectId === s.id && t.kind !== 'event');
  const open = all.filter(t => isRec(t) || !t.done).map(t => inst(t, t.date || '')).sort((a, b) => (a.d || '9') < (b.d || '9') ? -1 : 1);
  const done = all.filter(t => !isRec(t) && t.done).map(t => inst(t, t.date || ''));
  const dls = deadlines().filter(d => (d.kind === 'task' && taskOf(d.id) && taskOf(d.id).subjectId === s.id) || (d.kind === 'exam' && (D.exams.find(e => e.id === d.id) || {}).subjectId === s.id));
  const goals = D.goals.filter(g => g.subjectId === s.id);
  return `<button class="btn btn-sm btn-quiet" data-a="subj-back" style="margin:0 0 14px -10px">${ico('left')}All subjects</button>
  ${pageHead(s.name, `${st.open} open · ${st.done} done`, `<button class="btn" data-a="subj-edit" data-id="${s.id}">Edit</button>${addBtn('Add task', `data-subject="${s.id}"`)}`)}
  <div style="max-width:380px;margin:-14px 0 36px"><div style="display:flex;align-items:center;gap:12px">${bar(st.pct, 'green')}<span class="gs num">${st.pct}%</span></div></div>
  <div class="grid-2"><div class="col-stack">
    <section><h2 class="h2">Tasks</h2>${open.length ? `<ul class="tlist">${open.map(i => taskRow(i, { showDate: true })).join('')}</ul>` : emptyBox('No open tasks.', '', `<button class="btn btn-sm" data-a="add" data-subject="${s.id}">${ico('plus')}Add a task</button>`, true)}</section>
    ${done.length ? `<section><h2 class="h2">Completed</h2><ul class="tlist">${done.map(i => taskRow(i, { showDone: true })).join('')}</ul></section>` : ''}
  </div><div class="col-stack">
    <section><h2 class="h2">Upcoming deadlines</h2>${dls.length ? dlList(dls, td) : '<p class="muted" style="font-size:14px">No deadlines.</p>'}</section>
    ${goals.length ? `<section><h2 class="h2">Goals</h2><ul class="rows">${goals.map(g => { const gs = goalStats(g); return `<li class="row" data-a="nav" data-p="goals" role="button" tabindex="0"><div class="grow"><div class="r-t">${esc(g.title)}</div></div><div class="r-side">${bar(gs.pct, 'purple')}<div class="mini"><span>Progress</span><span class="num">${gs.pct}%</span></div></div></li>`; }).join('')}</ul></section>` : ''}
  </div></div>`;
}

/* ================= HABITS ================= */
function viewHabits() {
  const td = today();
  const seg = `<div class="seg"><button class="${U.hv === 'week' ? 'on' : ''}" data-a="hab-view" data-v="week">Week</button><button class="${U.hv === 'month' ? 'on' : ''}" data-a="hab-view" data-v="month">Month</button></div>`;
  const acts = seg + `<button class="btn btn-primary" data-a="habit-new">${ico('plus')}New habit</button>`;
  if (!D.habits.length) return pageHead('Habits', 'Small things you do regularly.', acts) + emptyBox('No habits yet.', 'Start with one or two: study, exercise, read.', `<button class="btn btn-primary" data-a="habit-new">${ico('plus')}New habit</button>`);

  if (U.hv === 'month') {
    const sel = D.habits.find(h => h.id === U.hSel) || D.habits[0]; U.hSel = sel.id;
    const ym = U.hMonth || td.slice(0, 7) + '-01';
    const first = pd(ym), month = first.getMonth();
    const lead = (first.getDay() + 6) % 7;
    const dim = new Date(first.getFullYear(), month + 1, 0).getDate();
    let cells = DAYS.map(d => `<div class="dw">${d.slice(0, 1)}</div>`).join('') + '<div class="blank"></div>'.repeat(lead);
    for (let k = 1; k <= dim; k++) {
      const d = ymd(new Date(first.getFullYear(), month, k));
      cells += `<button class="hb ${sel.log[d] ? 'on' : ''} ${d > td ? 'fut' : ''}" data-a="habit" data-id="${sel.id}" data-d="${d}" aria-pressed="${!!sel.log[d]}" aria-label="${fmtLong(d)}">${k}</button>`;
    }
    const cnt = Object.keys(sel.log).filter(d => d.startsWith(ym.slice(0, 7))).length;
    const sk = streak(sel);
    return pageHead('Habits', 'Tap a day to check it off.', acts) +
      `<div class="chips" style="margin-bottom:20px">${D.habits.map(h => `<button class="chip ${h.id === sel.id ? 'on' : ''}" data-a="hab-sel" data-id="${h.id}">${esc(h.name)}</button>`).join('')}</div>
      <div class="pl-nav" style="margin-bottom:14px"><button class="icon-btn" data-a="hab-month" data-n="-1" aria-label="Previous month">${ico('left')}</button><strong style="min-width:150px;text-align:center;font-weight:600">${MONTHS[month]} ${first.getFullYear()}</strong><button class="icon-btn" data-a="hab-month" data-n="1" aria-label="Next month">${ico('right')}</button></div>
      <div class="hab-cal">${cells}</div>
      <p style="margin-top:16px" class="streak"><span class="num">${cnt}</span> check-ins this month${sk > 1 ? ` · ${ico('flame')}<span class="num">${sk}</span>-day streak` : ''}</p>`;
  }

  const days = weekDays(td);
  const head = `<tr><th></th>${days.map(d => `<th class="${d === td ? 'tdy' : ''}">${DAYS[wdOf(d)].slice(0, 3)}<b>${pd(d).getDate()}</b></th>`).join('')}</tr>`;
  const rows = D.habits.map(h => {
    const n = days.filter(d => h.log[d]).length, sk = streak(h);
    return `<tr><td><div class="hn">${esc(h.name)}</div><div class="hs">${n}/7 this week${sk > 1 ? ' · ' + sk + '-day streak' : ''}</div></td>${days.map(d => `<td><button class="hb ${h.log[d] ? 'on' : ''} ${d > td ? 'fut' : ''}" data-a="habit" data-id="${h.id}" data-d="${d}" aria-pressed="${!!h.log[d]}" aria-label="${esc(h.name)}, ${fmtLong(d)}">${ico('check')}</button></td>`).join('')}</tr>`;
  }).join('');
  return pageHead('Habits', 'Tap a circle to check a day off. You can fill in earlier days too.', acts) +
    `<table class="hab-table"><thead>${head}</thead><tbody>${rows}</tbody></table>
     <p style="margin-top:20px"><button class="link" data-a="habit-manage">Edit or remove habits</button></p>`;
}

/* ================= REVIEW ================= */
function viewReview() {
  const r = reviewData(U.rv), td = today(), isThis = r.days.includes(td);
  const label = fmtShort(r.days[0]) + ' – ' + fmtShort(r.days[6]);
  const nav = `<div class="pl-nav"><button class="icon-btn" data-a="rv" data-n="-7" aria-label="Previous week">${ico('left')}</button><strong style="min-width:140px;text-align:center;font-weight:600;font-size:14px">${isThis ? 'This week' : label}</strong><button class="icon-btn" data-a="rv" data-n="7" aria-label="Next week">${ico('right')}</button></div>`;
  const overdue = overdueList();
  const remaining = Math.max(0, r.planned.length - r.done.length);
  const stats = `<div class="stats">
    <div class="stat"><div class="v">${r.done.length}<span class="muted"> / ${r.planned.length}</span></div><div class="l">Completed</div></div>
    <div class="stat"><div class="v">${remaining}</div><div class="l">Still open</div></div>
    <div class="stat"><div class="v">${Math.floor(r.studyMin / 60)}<span class="muted">h</span> ${pad(r.studyMin % 60)}<span class="muted">m</span></div><div class="l">Study time</div></div>
    <div class="stat"><div class="v">${r.postponed.length}</div><div class="l">Postponed</div></div></div>`;
  const max = Math.max(1, ...r.perDay), best = r.perDay.indexOf(Math.max(...r.perDay));
  const chart = `<div class="days-bar">${r.days.map((d, i) => `<div class="c ${r.perDay[i] > 0 ? 'has' : ''} ${i === best && r.perDay[i] > 0 ? 'best' : ''}"><em>${r.perDay[i] || ''}</em><i style="height:${Math.max(3, r.perDay[i] / max * 74)}px"></i><span>${DAYS[wdOf(d)].slice(0, 3)}</span></div>`).join('')}</div>`;
  const bestTxt = r.perDay[best] > 0 ? `Your best day was ${DAYS[wdOf(r.days[best])]} with ${r.perDay[best]} ${r.perDay[best] === 1 ? 'task' : 'tasks'} done.` : 'Complete a few tasks and your strongest days show up here.';
  const att = attention().slice(0, 8);
  const attHtml = att.length
    ? `<ul class="rem">${att.map(a => `<li class="k-${a.kind}">${ico('alert')}<div class="grow"><div>${esc(a.text)}</div><div class="rs">${esc(a.sub)}</div></div><button class="btn btn-sm" data-a="${a.a}" data-id="${a.id || ''}" data-d="${a.d || ''}" data-p="${a.p || ''}">${a.label}</button></li>`).join('')}</ul>`
    : emptyBox('Nothing needs attention.', 'No overdue work, no stalled goals. Nice.', '', true);
  const up = deadlines().filter(d => diffDays(td, d.date) <= 14).slice(0, 6);
  return pageHead('Review', 'A quick look back, and what to look at next.', nav) + stats +
    `<div class="grid-2"><div class="col-stack">
      <section><h2 class="h2">Needs attention</h2>${attHtml}</section>
      <section><h2 class="h2">Most productive days</h2>${chart}<p class="muted" style="margin-top:14px;font-size:14px">${bestTxt}</p></section>
    </div><div class="col-stack">
      <section><h2 class="h2">This week</h2><ul class="kv">

/* ================= modal + toast ================= */
const MOD = () => $('#modal');
function openModal(html, o = {}) {
  const m = MOD();
  if (!m.classList.contains('open')) {
    const a = document.activeElement;
    U.lastTrigger = a && a !== document.body ? a : null;
  }
  m.innerHTML = `<div class="scrim" data-a="scrim"></div><div class="sheet ${o.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(o.label || 'Dialog')}">${html}</div>`;
  m.classList.add('open'); document.body.classList.add('noscroll');
  const f = $(o.focus || 'input:not([type=hidden]):not(.sr),select', m);
  if (f && o.autofocus !== false) setTimeout(() => { try { f.focus(); } catch (e) { /* noop */ } }, 30);
  else setTimeout(() => { const s = $('.sheet', m); if (s) { s.setAttribute('tabindex', '-1'); try { s.focus(); } catch (e) { /* noop */ } } }, 30);
}
function closeModal() {
  const m = MOD();
  /* drop focus and form state first, so a late blur/change can't act on a
     half-removed dialog */
  const a = document.activeElement;
  if (a && m.contains(a)) { try { a.blur(); } catch (e) { /* noop */ } }
  U.form = null;
  m.classList.remove('open'); m.innerHTML = ''; document.body.classList.remove('noscroll');
  const t = U.lastTrigger; U.lastTrigger = null;
  if (t && document.contains(t)) { try { t.focus(); } catch (e) { /* noop */ } }
}
/* keeps Tab inside an open dialog */
function trapFocus(e) {
  const sheet = $('.sheet', MOD()); if (!sheet) return;
  const f = $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])', sheet)
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
const modalOpen = () => MOD().classList.contains('open');

function toast(msg, o = {}) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (o.cls || ''); el.setAttribute('role', 'status');
  el.innerHTML = `<span class="msg">${esc(msg)}</span>${o.undo ? '<button data-a="toast-undo">Undo</button>' : ''}${o.action ? `<button data-a="toast-act">${esc(o.action.label)}</button>` : ''}`;
  el._undo = o.undo; el._act = o.action;
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => el.remove(), o.ms || 6000);
}

/* Undo restores a whole-store snapshot, so it is only offered for the most
   recent change. A stale toast refuses rather than silently discarding
   everything done since. */
let mutSeq = 0;
function mutate(fn, msg) {
  const snap = JSON.stringify(D);
  fn(); save(); render();
  const at = ++mutSeq;
  if (msg) toast(msg, { undo: () => {
    if (at !== mutSeq) { toast('Too much has changed since then to undo.'); return; }
    D = JSON.parse(snap); mutSeq++; save(); render();
  } });
}

function refreshForm() {
  const F = U.form; if (!F || !$('#f-conf')) return;

function autoGoal() {
  const F = U.form; if (!F || F.touched.goal) return;
  const f = F.f;
  if (F.editing && f.goalId) return;
  const open = D.goals.filter(g => goalStats(g).pct < 100);
  const words = (f.title || '').toLowerCase().match(/[a-z]{4,}/g) || [];
  let pick = open.find(g => words.some(w => g.title.toLowerCase().includes(w)) && (!f.subjectId || g.subjectId === f.subjectId));
  if (!pick && f.subjectId) { const same = open.filter(g => g.subjectId === f.subjectId); if (same.length === 1) pick = same[0]; }
  f.goalId = pick ? pick.id : (F.init.goalId || null);
}

function applyParse() {
  const F = U.form, f = F.f, tc = F.touched;
  const p = parseQuick(F.raw);
  F.parsed = p;
  if (!tc.date) f.date = p.date || F.init.date;
  if (!tc.due) f.due = p.due || F.init.due;
  if (!tc.start) f.start = p.start != null ? fromMin(p.start) : F.init.start;
  if (!tc.duration) f.duration = p.duration || (f.kind === 'event' ? 60 : F.init.duration);
  if (!tc.priority) f.priority = p.priority || F.init.priority;
  if (!tc.subject) f.subjectId = p.subjectId || F.init.subjectId;
  if (!tc.kind) { const k = p.kind || F.init.kind; f.kind = k; F.tab = k; }
  f.title = p.title || F.raw;
  autoGoal();
  syncTimeInputs();
  const ti = $('#f-title'); if (ti) ti.placeholder = f.kind === 'event' ? 'Lunch, Lab session, Meeting…' : f.kind === 'study' ? 'Study Physics tomorrow from 5 to 6 PM' : 'Finish C assignment by Monday';
}

function onFormField(name, el) {
  const F = U.form; if (!F || F.tab === 'habit' || F.tab === 'goal') return;
  const f = F.f; F.dirty = true; F.allowOverlap = false;
  switch (name) {
    case 'title':
      F.raw = el.value; f.title = el.value;
      if (!F.editing) applyParse(); else { autoGoal(); }
      break;
    case 'date': F.touched.date = true; f.date = el.value || null; if (!f.date) f.start = null; if (f.recur && f.recur.type === 'weekly') f.recur.days = []; break;
    case 'start':
      F.touched.start = true; f.start = el.value || null; if (f.start && !f.date) f.date = today();
      break;
    case 'end': {
      const st = toMin(f.start), en = toMin(el.value);
      if (st != null && en != null && en > st) { f.duration = en - st; F.touched.duration = true; }
      break;
    }
    case 'duration': F.touched.duration = true; f.duration = +el.value || f.duration; break;
    case 'due': F.touched.due = true; f.due = el.value || null; break;
    case 'subject': F.touched.subject = true; f.subjectId = el.value || null; autoGoal(); break;
    case 'goal': F.touched.goal = true; f.goalId = el.value || null; break;
    case 'repeat':
      f.recur = { type: el.value, days: el.value === 'custom' ? [f.date ? wdOf(f.date) : 0] : [] };
      $('#f-days').innerHTML = daysHtml(f.recur); break;
    case 'reminder': {
      $('#f-remc').style.display = el.value === 'custom' ? '' : 'none';
      f.reminder = el.value === 'custom' ? (+($('[data-f=remcustom]').value) || 15) : (el.value === 'default' || el.value === 'off' ? el.value : +el.value);
      break;
    }
    case 'remcustom': f.reminder = Math.max(1, +el.value || 15); break;
    case 'notes': f.notes = el.value; break;
    case 'sub': { const s = f.subtasks.find(x => x.id === el.dataset.sid); if (s) s.text = el.value; return; }
  }
  if (name !== 'title') syncTimeInputs();
  refreshForm();
}

function saveTaskForm() {
  const F = U.form, f = F.f;
  const title = (f.title || F.raw || '').trim();
  if (!title) {
    const ti = $('#f-title'); ti.focus(); ti.style.outline = '2px solid var(--red)';
    toast('Give it a name first.'); return;
  }
  f.title = title;
  if (f.subtasks) f.subtasks = f.subtasks.filter(s => s.text.trim());
  const c = f.date && f.start && !F.allowOverlap ? conflictFor(f.date, toMin(f.start), f.duration, F.editing ? f.id : null) : null;
  if (c) { const w = $('.warn'); if (w) { w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); } return; }
  if (!f.date) f.start = null;
  const clean = clone(f); delete clean._instDate;
  const editing = F.editing;

/* ================= shell + render ================= */
const NAV = [['today', 'Today'], ['planner', 'Planner'], ['tasks', 'Tasks'], ['subjects', 'Subjects'], ['goals', 'Goals'], ['habits', 'Habits'], ['exams', 'Exams'], ['review', 'Review']];
const NAV_GROUPS = [

];
const NAV_LABEL = NAV.reduce((o, [p, l]) => (o[p] = l, o), {});
const PAGES = { today: viewToday, planner: viewPlanner, tasks: viewTasks, subjects: viewSubjects, goals: viewGoals, habits: viewHabits, exams: viewExams, review: viewReview, settings: viewSettings };

function shell(content) {

  ).join('');

    </nav></div>`;

/* Replacing the DOM blurs whatever was focused, and a blur can fire `change`,
   which can ask for another render mid-flight. One render at a time. */
let rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow() {
  const root = $('#app');
  const scrollY = window.scrollY;
  const wk = $('#wkscroll');
  const wkTop = wk ? wk.scrollTop : null, wkLeft = wk ? wk.scrollLeft : null;
  let html;
  try { html = (PAGES[U.page] || viewToday)(); } catch (e) { console.error(e); html = '<p>Something went wrong showing this page.</p>'; }
  root.innerHTML = shell(html);
  applyTheme();
  const nw = $('#wkscroll');
  if (nw) {
    if (wkTop != null && U.plannerScrolled) { nw.scrollTop = wkTop; nw.scrollLeft = wkLeft; }
    else { const gs = +nw.dataset.gs; nw.scrollTop = Math.max(0, (nowMin() - gs) / 60 * HH - 140); U.plannerScrolled = true; }
  } else window.scrollTo(0, scrollY);
  if (U.focus) {
    const el = document.getElementById(U.focus);
    if (el) {
      el.focus();
      if (U.focusEnd && el.setSelectionRange) { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) { /* noop */ } }
    }
    U.focus = null; U.focusEnd = false;
  }
  if (U.pulse) setTimeout(() => { U.pulse = null; }, 420);
}
function go(p) { U.page = p; if (p !== 'planner') U.plannerScrolled = false; if (p !== 'subjects') U.subj = null; render(); window.scrollTo(0, 0); }

let initialTheme = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  const t = D.settings.theme, h = document.documentElement;
  if (t === 'light' || t === 'dark') h.setAttribute('data-theme', t);
  else if (initialTheme) h.setAttribute('data-theme', initialTheme); else h.removeAttribute('data-theme');
  /* match the browser/status bar to the theme actually showing */
  try {
    const dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0E0E10' : '#F7F6F4');
  } catch (e) { /* noop */ }
}

/* ================= events ================= */
const ds = el => el.dataset;
function onClick(e) {
  if (dragJustEnded) { dragJustEnded = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = ds(el).a, d = ds(el);
  /* nested interactive elements inside a data-a container: the innermost wins (closest already does that) */
  switch (a) {
    case 'nav': if (modalOpen()) closeModal(); go(d.p); break;
    case 'more': openMore(); break;
    case 'add': {
      const o = {};
      if (d.date) o.date = d.date;
      if (d.start) o.start = +d.start;
      if (d.subject) o.subjectId = d.subject;
      if (d.goal) o.goalId = d.goal;
      if (modalOpen()) closeModal();
      openAdd(o); break;
    }
    case 'toggle': {
      e.stopPropagation();
      const t = taskOf(d.id); if (!t) break;
      const day = d.d || t.date || today();
      const willDone = !isDoneOn(t, day);
      U.pulse = willDone ? d.id + '@' + (d.d || '') : null;
      mutate(() => toggleDone(d.id, day), willDone ? 'Completed “' + t.title + '”' : null);
      break;
    }
    case 'edit': {
      if (e.target.closest('[data-a=toggle],[data-a=sub],[data-a=expand]')) break;
      openTaskForm({ id: d.id, d: d.d }); break;
    }
    case 'sub': { e.stopPropagation(); mutate(() => { const t = taskOf(d.id); const s = t && t.subtasks.find(x => x.id === d.sid); if (s) s.done = !s.done; }); break; }
    case 'expand': e.stopPropagation(); U.expanded[d.k] = !U.expanded[d.k]; render(); break;
    case 'resched': openReschedule([{ id: d.id, d: d.d || (taskOf(d.id) || {}).date || today() }]); break;
    case 'carry': carry(d.scope, d.to); break;
    case 'wrap': U.wrap = true; render(); break;
    case 'wrap-off': U.wrap = false; render(); break;
    case 'import-yes': { const o = U.form && U.form.pending; closeModal(); if (o) applyImport(o); break; }
    case 'plan-day': if (modalOpen()) closeModal(); openPlanDay(); break;
    case 'plan-apply': {
      const plan = U.form && U.form.plan; closeModal(); if (!plan) break;
      mutate(() => plan.forEach(p => { const t = taskOf(p.id); if (t) { const prev = t.date; t.date = today(); t.start = fromMin(p.start); if (prev && prev < today()) t.moves.push({ on: today(), from: prev, to: today() }); } }), plan.length + ' ' + (plan.length === 1 ? 'task' : 'tasks') + ' scheduled');
      break;
    }
    case 'rs': doReschedule(d.w); break;
    case 'tf': U.tf.status = d.s; go('tasks'); break;
    case 'tf-status': U.tf.status = d.s; render(); break;
    case 'tf-clear': U.tf.q = ''; U.tf.subject = ''; U.tf.priority = ''; U.focus = 'tq'; render(); break;
    /* planner */
    case 'pl': {
      const n = +d.n;
      if (U.pv === 'month') { const x = pd(U.pd); x.setDate(1); x.setMonth(x.getMonth() + n); U.pd = ymd(x); }
      else U.pd = addDays(U.pd, U.pv === 'week' ? 7 * n : n);
      render(); break;
    }
    case 'pl-today': U.pd = today(); U.plannerScrolled = false; render(); break;
    case 'pl-view': U.pv = d.v; U.plannerScrolled = false; render(); break;
    case 'pl-goto': e.stopPropagation(); U.pd = d.d; U.pv = 'day'; U.plannerScrolled = false; if (U.page !== 'planner') U.page = 'planner'; render(); break;
    /* subjects */
    case 'subj-open': U.subj = d.id; render(); window.scrollTo(0, 0); break;
    case 'subj-back': U.subj = null; render(); break;
    case 'subj-new': openSubjectForm(); break;
    case 'subj-edit': openSubjectForm(d.id); break;
    case 'sb-color': U.form.color = d.c; $$('#sb-sw button').forEach(b => b.classList.toggle('on', b.dataset.c === d.c)); break;
    case 'sb-save': {
      const name = $('#sb-name').value.trim(); if (!name) { $('#sb-name').focus(); break; }
      const F = U.form; closeModal();
      mutate(() => { if (F.id) { const s = subjOf(F.id); s.name = name; s.color = F.color; } else { const s = { id: 's_' + uid(), name, color: F.color }; D.subjects.push(s); } });
      break;
    }
    case 'sb-del': {
      const id = U.form.id; closeModal();
      mutate(() => { D.subjects = D.subjects.filter(s => s.id !== id); D.tasks.forEach(t => { if (t.subjectId === id) t.subjectId = null; }); D.goals.forEach(g => { if (g.subjectId === id) g.subjectId = null; }); D.exams.forEach(x => { if (x.subjectId === id) x.subjectId = null; }); U.subj = null; }, 'Subject deleted');
      break;
    }
    /* goals */

function onKey(e) {

async function exportData() {
  const json = JSON.stringify(D, null, 2);
  try {
    const dl = window.claude && await window.claude.use('downloads');
    if (dl) { await dl.save({ filename: 'planner-backup-' + today() + '.json', data: json }); toast('Backup ready.'); return; }
  } catch (err) { if (err && err.code === 'declined') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'planner-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  } catch (err) { toast('Couldn\'t export from here.'); }
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let o;
    try { o = JSON.parse(r.result); if (!o || !Array.isArray(o.tasks)) throw new Error('bad'); }
    catch (err) { toast('That file doesn\'t look like a planner backup.'); return; }
    const hasOwn = !D.sample && (D.tasks.length || D.goals.length || D.exams.length);
    if (!hasOwn) { applyImport(o); return; }
    U.form = { kind: 'confirm', pending: o };
    openModal(`<div class="m-head"><h2>Replace your data?</h2><button class="icon-btn" data-a="close-modal" aria-label="Close">${ico('x')}</button></div>
      <div class="m-body"><p>This backup holds <b>${o.tasks.length}</b> ${o.tasks.length === 1 ? 'task' : 'tasks'}. Importing replaces everything currently on this device — tasks, goals, exams, habits and settings.</p>
      <p class="muted">Export a backup of what you have now if you might want it back.</p></div>
      <div class="m-foot"><span class="grow"></span><button class="btn" data-a="close-modal">Cancel</button><button class="btn btn-danger" data-a="import-yes">Replace everything</button></div>`,
      { cls: 'sm', autofocus: false, label: 'Confirm import' });
  };
  r.readAsText(file);
}
function applyImport(o) {
  D = migrate(o); D.sample = false; save(); render(); toast('Backup imported.');
}

/* ================= drag & drop (planner) ================= */
let drag = null, dragJustEnded = false;
const snap15 = m => Math.round(m / 15) * 15;

function elAtPoint(x, y) { return (document.elementsFromPoint ? document.elementsFromPoint(x, y) : [document.elementFromPoint(x, y)]).filter(Boolean); }

function onPointerDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('[data-a=toggle]')) return;
  const blk = e.target.closest('[data-blk]'), chip = e.target.closest('[data-chip]');
  const node = blk || chip; if (!node) return;
  const rz = !!e.target.closest('[data-rz]');
  const rect = node.getBoundingClientRect();
  const id = node.dataset.blk || node.dataset.chip, d = node.dataset.d;
  const t = taskOf(id); if (!t) return;
  const i = inst(t, d);
  drag = { node, id, d, isRz: rz && !!blk, isChip: !!chip, x0: e.clientX, y0: e.clientY, pid: e.pointerId, ptype: e.pointerType, active: false, grab: e.clientY - rect.top, i, cur: null, ind: null, timer: null };
  if (drag.isRz && e.pointerType !== 'mouse') { activateDrag(); return; }
  if (e.pointerType === 'touch' || e.pointerType === 'pen') drag.timer = setTimeout(() => { if (drag) { activateDrag(); } }, 380);
}
function activateDrag() {
  if (!drag || drag.active) return;
  drag.active = true; document.body.classList.add('is-dragging'); drag.node.classList.add('dim');
  try { drag.node.setPointerCapture(drag.pid); } catch (e) { /* noop */ }
  if (navigator.vibrate && drag.ptype === 'touch') try { navigator.vibrate(10); } catch (e) { /* noop */ }
}
function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.active) {
    const dist = Math.hypot(dx, dy);
    if (drag.ptype === 'touch') { if (dist > 8) { clearTimeout(drag.timer); drag = null; } return; }
    if (dist < 5) return;
    activateDrag();
  }
  e.preventDefault();
  updateDrag(e);
}
function clearIndicators() { $$('.drop-ind').forEach(x => x.remove()); $$('.lane.over').forEach(x => x.classList.remove('over')); }
function updateDrag(e) {
  const gs = gridMeta.gs, i = drag.i;
  clearIndicators();
  if (drag.isRz) {
    const dm = snap15((e.clientY - drag.y0) / HH * 60);
    const nd = Math.max(15, i.dur + dm);
    drag.cur = { date: drag.d, start: i.start, dur: nd };
    drag.node.style.height = Math.max(22, nd / 60 * HH - 2) + 'px';
    const mt = drag.node.querySelector('.b-m'); if (mt) mt.textContent = fmtRange(i.start, i.start + nd);
    return;
  }
  const stack = elAtPoint(e.clientX, e.clientY);
  const col = stack.find(x => x.dataset && x.dataset.col), lane = stack.find(x => x.dataset && x.dataset.lane);
  if (col) {
    const r = col.getBoundingClientRect();
    let s = gs + snap15(((e.clientY - r.top - (drag.isChip ? 12 : drag.grab)) / HH) * 60);
    const dur = i.dur || D.settings.defaultDuration;
    s = Math.max(gs, Math.min(s, gridMeta.ge - Math.min(dur, 60)));
    drag.cur = { date: col.dataset.col, start: s, dur };
    const ind = document.createElement('div'); ind.className = 'drop-ind';
    ind.style.top = (s - gs) / 60 * HH + 'px'; ind.style.height = Math.max(22, dur / 60 * HH - 2) + 'px'; ind.textContent = fmtRange(s, s + dur);
    col.appendChild(ind);
  } else if (lane) {
    lane.classList.add('over'); drag.cur = { date: lane.dataset.lane, start: null, dur: i.dur };
  } else drag.cur = null;
}
function onPointerUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  clearTimeout(drag.timer);
  if (!drag.active) { drag = null; return; }
  const c = drag.cur, i = drag.i, isRz = drag.isRz;
  clearIndicators(); document.body.classList.remove('is-dragging'); drag.node.classList.remove('dim');
  drag = null; dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 60);
  if (!c) { render(); return; }
  commitDrag(i, c, isRz);
}
function cancelDrag() {
  if (!drag) return; clearTimeout(drag.timer); clearIndicators(); document.body.classList.remove('is-dragging'); drag = null; render();
}
function commitDrag(i, c, isRz) {
  const t = taskOf(i.id); if (!t) return;
  const dur = c.dur;
  if (c.date === i.d && c.start === i.start && dur === i.dur) { render(); return; }
  if (c.start != null) {
    const clash = conflictFor(c.date, c.start, dur, i.id);
    if (clash) {
      const slot = freeSlot(c.date, dur, c.start, i.id);
      render();
      if (isRz) { toast('That would overlap ' + clash.t.title + '.'); return; }
      toast('You already have ' + clash.t.title + ' from ' + fmtRange(clash.start, clash.end) + '.', slot != null ? { ms: 8000, action: { label: 'Move to ' + fmtT(slot), fn: () => mutate(() => applyMove(i, { date: c.date, start: slot, dur }, isRz)) } } : {});
      return;
    }
  }
  mutate(() => applyMove(i, c, isRz));
}
function applyMove(i, c, isRz) {
  let t = taskOf(i.id); if (!t) return;
  if (isRec(t)) t = detach(t, i.d);
  const prev = t.date;
  t.duration = c.dur;
  t.date = c.date; t.start = c.start != null ? fromMin(c.start) : null;
  if (prev && c.date > prev) t.moves.push({ on: today(), from: prev, to: c.date });
}

function onDragStart(e) {

  if (ch) { e.dataTransfer.setData('text/plain', ch.dataset.mchip + '|' + ch.dataset.d); e.dataTransfer.effectAllowed = 'move'; return; }
  if (row) { e.dataTransfer.setData('text/plain', 'reorder|' + row.dataset.reorder); e.dataTransfer.effectAllowed = 'move'; U.reorderId = row.dataset.reorder; }
}
function onDragOver(e) {

  const row = e.target.closest && e.target.closest('[data-reorder]');
  if (cell) { e.preventDefault(); $$('.mcell.over').forEach(x => { if (x !== cell) x.classList.remove('over'); }); cell.classList.add('over'); }
  else if (row && U.reorderId && row.dataset.reorder !== U.reorderId) {
    e.preventDefault(); $$('.drop-above,.drop-below').forEach(x => x.classList.remove('drop-above', 'drop-below'));
    const r = row.getBoundingClientRect(); row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-above' : 'drop-below');
